<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akanksha Gupta · Product Designer</title>
<meta name="description" content="Akanksha Gupta, product designer. I design interfaces and then build them into working prototypes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap" rel="stylesheet">
<link rel="icon" href="/assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="theme-color" content="#F6F4F1">
<!-- React mounts here; display:contents keeps the page's children in <body>'s flex column. -->
<style>#root{display:contents}</style>
  <!-- Light by default; a visitor's saved choice of dark is applied before first paint. -->
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('theme-choice')==='dark'?'dark':'light'}catch(e){document.documentElement.dataset.theme='light'}</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/portfolio/main.tsx"></script>
</body>
</html>
